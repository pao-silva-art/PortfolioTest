<!DOCTYPE html>
<html>
    <head>
        <style>
             html,body{
                margin: 0;
                padding: 0;
                overflow-x: hidden;
                font-family: "Arial Rounded MT Bold";
                color: aliceblue;
                text-shadow: 0px 0px 2dvh blue, 0px 0px 1dvh blue, 0px 0px 3dvh blue;
                height: 100%;
                width: 100%;
                background-color: cyan;
                
            }

            a {
                color: white;
            }

            h2{
                margin: 0;
                padding: 0;
                font-size: 1.5em;
            }

            h1{
                margin: 0;
                padding: 0;
                font-size: 0.5em;
            }

            .bg {
                width: 100%;
                height: auto;
                position: fixed;
                min-width: 100%;
                 min-height: 100%;
                left: 0px;
                top: 0px;
                z-index: 1;
                pointer-events: none;
                animation-name: fade;
                animation-duration: 2s;
                animation-iteration-count: 1;
            }

            @font-face {
                font-family: "Arial Rounded MT Bold";
                src: url("fonts/ARLRDBD.TTF") format("truetype");
            }

            @keyframes orbit {
                from {  -webkit-transform: rotate(0deg) translateX(20px) rotate(0deg); }
                to   {  -webkit-transform: rotate(360deg) translateX(20px) rotate(-360deg); }
            }

            @keyframes fade {
                from {
                    opacity: 0%;
                }

                to {
                    opacity: 100%;
                }
            }

            .image{
                top: 8%;
                position: relative;
                left: 4%;
                width: 80%;
                aspect-ratio: 7 / 4;
                background-color: none;
                z-index: 10;
                object-fit: cover;
            }

            .image img {
                object-fit: cover;
                overflow: hidden;
            }

            .caption{
                top: 8%;
                position: relative;
                left: 4%;
                width: 80%;
                aspect-ratio: 8 / 1;
                background-color: none;
                z-index: 10;
            }

            img {
                position: inherit;
                width: 90%;
            }

        </style>
    </head>
<body>
    <div class="image">
        <img src="images/gallery/PaoSilva_ST_01.jpg">
    </div>
    <br>
    <div class="caption"></div>
    <br>
    <div class="image">
        <img src="images/gallery/PaoSilva_ST_02.jpg">
    </div>
    <br>
    <div class="caption"></div>
    <br>
    <div class="image">
        <img src="images/gallery/PaoSilva_ST_03.jpg">
    </div>
    <br>
    <div class="caption"></div>
    <br>
    <div class="image">
        <img src="images/gallery/PaoSilva_ST_04.jpg">
    </div>
    <br>
    <div class="caption"></div>
    <br>
    <div class="image">
        <img src="images/gallery/PaoSilva_ST_05.jpg">
    </div>
    <br>
    <div class="caption"></div>
    <br>
    <div class="image">
        <img src="images/gallery/PaoSilva_ST_06.jpg">
    </div>
    <br>
    <div class="caption"></div>
    <br>
    <div class="image">
        <img src="images/gallery/PaoSilva_ST_07.jpg">
    </div>
    <br>
    <div class="caption"></div>
    <br>
    <div class="caption"></div>
    <img src="images/gallery_BG.png" class="bg">  
</body>
</html>
