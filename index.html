<!DOCTYPE html>
<html>
    <head>
        <style>
            html,body{
                margin: 0;
                padding: 0;
                overflow-x: hidden;
                font-family: Arial, Helvetica, sans-serif;
                color: aliceblue;
                text-shadow: 0px 0px 2dvh blue, 0px 0px 1dvh blue, 0px 0px 7dvh blue;
                height: 100%;
                width: 100%;
                background-color: cyan;
            }

            #hero{
                width: 100vw;
                height: 100dvh;
                position: absolute;
                top: 0%;
                left: 0%;
                z-index: 10;
                background-color: red;
                background-image: url(images/portfolio_web_HERO._FLATiMAGE.png);
                background-position: center;
                background-size: cover;
                cursor: pointer;
            }
            #scroll{
                width: 100vw;
                height: 300dvh;
                position: absolute;
                top: 100%;
                left: 0%;
                z-index: 1;
                background-color: cyan;
            }
        </style>
    </head>
<body>
    <div id="hero"></div>
    <div id="scroll"><h1>meow</h1></div>
</body>
</html>
